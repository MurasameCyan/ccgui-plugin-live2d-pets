name: Test and package plugin

on:
  push:
    branches: [fix/sdk-03-compat]
  workflow_dispatch:
    inputs:
      delivery:
        description: Package delivery (log avoids Actions artifact storage quota)
        type: choice
        default: artifact
        options: [artifact, log]

permissions:
  contents: read

concurrency:
  group: plugin-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - name: Package installable plugin
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version")
          mkdir -p package/ccgui-plugin-live2d-pets
          cp dist/main.js dist/manifest.json README.md package/ccgui-plugin-live2d-pets/
          cp -R dist/vendor package/ccgui-plugin-live2d-pets/vendor
          cp -R dist/icons package/ccgui-plugin-live2d-pets/icons
          cd package
          zip -r "ccgui-plugin-live2d-pets-${version}.zip" ccgui-plugin-live2d-pets
          sha256sum "ccgui-plugin-live2d-pets-${version}.zip" > SHA256SUMS
      - name: Export installable plugin through CI logs
        if: inputs.delivery == 'log'
        shell: bash
        run: |
          cat package/SHA256SUMS
          echo 'CCGUI_PLUGIN_ZIP_BEGIN'
          base64 -w 76 package/*.zip
          echo 'CCGUI_PLUGIN_ZIP_END'
      - uses: actions/upload-artifact@v4
        if: inputs.delivery != 'log'
        with:
          name: ccgui-plugin-live2d-pets
          path: |
            package/*.zip
            package/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
